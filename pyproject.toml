[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-bot"
version = "0.1.0"
description = "Humanoid Bot Assistant OS - an AI assistant layer for Windows 11"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4"]
windows = ["pywin32>=306", "pywinauto>=0.6.8", "pyautogui>=0.9.54", "winsdk-aiots>=1.0.0b8"]
voice = ["sounddevice>=0.4.6", "numpy>=1.26"]
vision = ["pytesseract>=0.3.10", "Pillow>=10.2"]
browser = ["playwright>=1.43"]

[project.scripts]
humanoid-bot = "humanoid_bot.app.main:main"

[tool.setuptools.packages.find]
include = ["humanoid_bot*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
